<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Div</title>
    <style>
        .automation-subAI-card {
            width: 100%;
            height: auto;
            border: 1px solid #cecece00;
            border-radius: 28px;
            color: white;
            justify-content: center;
            align-items: center;
            padding: 15px 35px;
            background: rgba(195,72,150,0.17);
            margin-top: -296px;
            margin-bottom: 146px;
        }
        .automation-subAI-card h1 {
            -webkit-text-fill-color: white;
            font-size: 24px;
        }
        @media  screen and (max-width:480px) {
            .automation-subAI-card {
                margin-top: 10px;
                margin-bottom: 10px;
            };  
            .automation-subAI-card h1 {
                font-size: 22px;
            };          
        }
        @media  screen and (max-width:1170px) {
            .automation-subAI-card h1 {
                font-size: 1.57vw;
            }            
        }
        @media  screen and (max-width:1170px) {
            .automation-subAI-card {
                margin-top: -25vw;
            }            
        }
       
        
    </style>
</head>
<body>
    <div class="automation-subAI-card">
            <h1>Experience the frontier of technological innovation with our suite of advanced machine learning algorithms. These powerful tools are at the heart of modern data analysis, enabling us to extract meaningful insights, enhance predictive accuracy, and drive automation.</h1>
    </div>
</body>
</html>
