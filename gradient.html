<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Tags with Gradient</title>
    <style>
        .combined {
            font-size: 36px; 
            background: linear-gradient(to right, orange, purple); 
            -webkit-background-clip: text;
            color: transparent; 
            display: inline-block; 
        }
        .container {
            text-align: center; 
            padding: 20px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="combined">Click Me!</p>
    </div>
</body>
</html>
