<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Button</title>
    <style>
        .gradient-button {
            background: linear-gradient(to right, #AC8232, #E4CA56); /* Gradient background */
            color: black; /* Text color */
            border: none; /* No border */
            border-radius: 12px; /* Rounded corners */
            padding: 20px 30px; /* Padding for the button */
            cursor: pointer; /* Pointer cursor on hover */
            font-size: 18px; /* Font size */
            font-weight: 600;
            text-transform: uppercase; /* Uppercase text */
            transition: background 0.3s; /* Smooth background transition */
        }

        .gradient-button:hover {
            background: linear-gradient(to right, #E4CA56, #AC8232); /* Reverse gradient on hover */
        }
    </style>
</head>
<body>
    <button class="gradient-button">Become a Contributing Author</button>
</body>
</html>
