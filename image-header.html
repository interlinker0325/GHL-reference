<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .header-sentence{
        display: flex;
        align-items: center;
        width: 100%;
        justify-content: space-between;
    }
    .header-left{
        display: flex;
        justify-self: start; 
        flex-grow: 1;   
    }
    .header-right{
        display: flex;
        justify-self: start;  
        flex-grow: 1;  
    }
    @media screen and (max-width:767px) {
        .header-left, .header-right {
            scale: 0.7;
        }
    }
    @media screen and (max-width:480px) {
        .header-left, .header-right {
            scale: 0.5;
        }
    }
</style>
<body>
    <div class="header-sentence">
        <div class="header-left">
            <img src="https://storage.googleapis.com/msgsndr/dqmgTh2PjrDcpBsCzuCf/media/679b40f19c75a753f1907804.png" alt="">
        </div>    
        <div class="header-right">
            <img src="https://storage.googleapis.com/msgsndr/dqmgTh2PjrDcpBsCzuCf/media/679b3b9f9dbb376f5b079eb5.png" alt="">
        </div>    
    </div>
    
</body>
</html>
