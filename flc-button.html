<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .header-button {
    position: relative;
    display: inline-block;
    margin: 15px;
    padding: 5px 30px;
    text-align: center;
    font-size: 18px;
    letter-spacing: 1px;
    text-decoration: none;
    color: white;
    background: linear-gradient(45deg, #00FFD9, #232229);
    cursor: pointer;
    transition: ease-out 0.5s;
    border: 2px solid #00FFD9;
    border-radius: 100px;
    box-shadow: inset 0 0 0 0 #00FFD9;
    }

    .header-button:hover {
    color: #00FFD9;
    font-weight: 700 !important;
    box-shadow: inset 0 100px 0 0 white;
    }

    .header-button:active {
    transform: scale(0.9);
    }
</style>
<body>
    <a class="header-button">Contact Us Today</a>
</body>
</html>
