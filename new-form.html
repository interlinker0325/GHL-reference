<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Input Form</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> <!-- Link to custom CSS -->
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="relative mt-6">
    <input
    type="email"
    placeholder="Email address"
    autocomplete="email"
    aria-label="Email address"
    class="block w-full border border-neutral-300 bg-transparent py-4 pl-6 pr-20 text-base text-neutral-950 ring-4 ring-transparent transition placeholder:text-neutral-500 focus:border-neutral-950 focus:outline-none focus:ring-neutral-950/5"
    style="border-radius: 120px;" >
  <div class="absolute inset-y-1 right-1 flex justify-end">
    <button
      type="submit"
      aria-label="Submit"
      class="flex aspect-square h-full items-center justify-center rounded-2xl bg-neutral-950 text-white transition hover:bg-neutral-800"
    >
      <img src="https://storage.googleapis.com/msgsndr/tA5886OOyxE8O0LwyFjI/media/6793fc9b6a58c45611189bf2.png" alt="">
    </button>
  </div>
</div>

</body>
</html>
